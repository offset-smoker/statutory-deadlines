name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer:
    name: composer validate and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - uses: ramsey/composer-install@v3
      - run: composer audit

  quality:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '^10.12'
          - laravel: '13.*'
            testbench: '^11.3'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: calendar, intl
          coverage: none
          tools: composer:v2

      - name: Pin Laravel ${{ matrix.laravel }}
        run: composer require --dev --no-update "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Static analysis, core without Laravel (PHPStan level max, no baseline)
        run: |
          vendor/bin/phpstan clear-result-cache -c phpstan-core.neon.dist
          vendor/bin/phpstan analyse --no-progress -c phpstan-core.neon.dist

      - name: Static analysis, everything with Larastan (level max, no baseline)
        run: |
          vendor/bin/phpstan clear-result-cache -c phpstan.neon.dist
          vendor/bin/phpstan analyse --no-progress -c phpstan.neon.dist

      # --fail-on-skipped: the Easter cross-check against ext-calendar must run.
      - name: Tests
        run: vendor/bin/pest --colors=never --fail-on-skipped

      - name: Example runs
        run: php examples/right-to-know.php
